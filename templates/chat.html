<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NagarNetra AI Assistant</title>
  <meta name="description" content="AI-powered chatbot for pothole reporting guidance, RTI complaints, and government priority analysis" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* ─── RESET & BASE ─── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-primary: #0a0a0f;
      --bg-secondary: #12121a;
      --bg-card: rgba(255, 255, 255, 0.03);
      --bg-card-hover: rgba(255, 255, 255, 0.06);
      --bg-glass: rgba(255, 255, 255, 0.05);
      --border: rgba(255, 255, 255, 0.08);
      --border-active: rgba(255, 255, 255, 0.15);
      --text-primary: #f0f0f5;
      --text-secondary: #8a8a9a;
      --text-muted: #5a5a6a;
      --accent-citizen: #22d3ee;
      --accent-citizen-dim: rgba(34, 211, 238, 0.15);
      --accent-citizen-glow: rgba(34, 211, 238, 0.3);
      --accent-gov: #f59e0b;
      --accent-gov-dim: rgba(245, 158, 11, 0.15);
      --accent-gov-glow: rgba(245, 158, 11, 0.3);
      --danger: #ef4444;
      --danger-dim: rgba(239, 68, 68, 0.15);
      --success: #22c55e;
      --success-dim: rgba(34, 197, 94, 0.15);
      --radius: 16px;
      --radius-sm: 10px;
      --radius-xs: 6px;
      --font-sans: 'Inter', -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --shadow-lg: 0 24px 48px rgba(0, 0, 0, 0.4);
      --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    html, body {
      height: 100%;
      font-family: var(--font-sans);
      background: var(--bg-primary);
      color: var(--text-primary);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ─── LAYOUT ─── */
    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      max-width: 900px;
      margin: 0 auto;
      position: relative;
    }

    /* ─── HEADER ─── */
    .header {
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(20px);
      background: rgba(10, 10, 15, 0.8);
      position: relative;
      z-index: 10;
      flex-shrink: 0;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-mark {
      width: 36px;
      height: 36px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 14px;
      letter-spacing: -0.5px;
      transition: var(--transition);
    }

    .logo-mark.citizen {
      background: var(--accent-citizen-dim);
      color: var(--accent-citizen);
      box-shadow: 0 0 20px var(--accent-citizen-glow);
    }

    .logo-mark.gov {
      background: var(--accent-gov-dim);
      color: var(--accent-gov);
      box-shadow: 0 0 20px var(--accent-gov-glow);
    }

    .header-title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .header-subtitle {
      font-size: 11px;
      color: var(--text-muted);
      font-family: var(--font-mono);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* ─── MODE TOGGLE ─── */
    .mode-toggle {
      display: flex;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 100px;
      padding: 3px;
      gap: 2px;
    }

    .mode-btn {
      padding: 7px 16px;
      border-radius: 100px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: var(--transition);
      white-space: nowrap;
    }

    .mode-btn.active.citizen-mode {
      background: var(--accent-citizen-dim);
      color: var(--accent-citizen);
      box-shadow: 0 0 12px var(--accent-citizen-glow);
    }

    .mode-btn.active.gov-mode {
      background: var(--accent-gov-dim);
      color: var(--accent-gov);
      box-shadow: 0 0 12px var(--accent-gov-glow);
    }

    .mode-btn:hover:not(.active) {
      color: var(--text-secondary);
      background: var(--bg-card-hover);
    }

    /* ─── MESSAGES AREA ─── */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }

    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-track { background: transparent; }
    .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    /* ─── MESSAGE BUBBLES ─── */
    .message {
      display: flex;
      gap: 12px;
      max-width: 85%;
      animation: msgIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes msgIn {
      from { opacity: 0; transform: translateY(12px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .message.user { align-self: flex-end; flex-direction: row-reverse; }
    .message.ai { align-self: flex-start; }

    .msg-avatar {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-xs);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .message.ai .msg-avatar {
      background: var(--bg-card);
      border: 1px solid var(--border);
    }

    .message.user .msg-avatar {
      background: var(--accent-citizen-dim);
    }

    .msg-avatar.gov-avatar { background: var(--accent-gov-dim) !important; }

    .msg-body {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .msg-sender {
      font-size: 11px;
      font-weight: 600;
      font-family: var(--font-mono);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
    }

    .msg-content {
      padding: 14px 18px;
      border-radius: var(--radius);
      font-size: 14px;
      line-height: 1.65;
      letter-spacing: -0.1px;
    }

    .message.ai .msg-content {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-top-left-radius: var(--radius-xs);
      color: var(--text-primary);
    }

    .message.user .msg-content {
      border-top-right-radius: var(--radius-xs);
      color: #fff;
    }

    .message.user.citizen-msg .msg-content {
      background: linear-gradient(135deg, rgba(34, 211, 238, 0.2), rgba(34, 211, 238, 0.08));
      border: 1px solid rgba(34, 211, 238, 0.2);
    }

    .message.user.gov-msg .msg-content {
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.2), rgba(245, 158, 11, 0.08));
      border: 1px solid rgba(245, 158, 11, 0.2);
    }

    .msg-content p { margin-bottom: 8px; }
    .msg-content p:last-child { margin-bottom: 0; }
    .msg-content strong { font-weight: 700; color: var(--text-primary); }
    .msg-content ul, .msg-content ol { padding-left: 18px; margin: 6px 0; }
    .msg-content li { margin-bottom: 4px; }
    .msg-content code {
      background: rgba(255, 255, 255, 0.08);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: var(--font-mono);
      font-size: 12px;
    }
    .msg-content pre {
      background: rgba(0, 0, 0, 0.3);
      padding: 12px 16px;
      border-radius: var(--radius-xs);
      overflow-x: auto;
      margin: 8px 0;
      font-family: var(--font-mono);
      font-size: 12px;
      line-height: 1.5;
      border: 1px solid var(--border);
    }

    .msg-content h3, .msg-content h4 {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      margin: 12px 0 6px;
    }

    .msg-content h3:first-child, .msg-content h4:first-child { margin-top: 0; }

    /* ─── TYPING INDICATOR ─── */
    .typing-indicator {
      display: flex;
      gap: 5px;
      padding: 14px 18px;
      align-items: center;
    }

    .typing-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--text-muted);
      animation: typingBounce 1.2s ease-in-out infinite;
    }

    .typing-dot:nth-child(2) { animation-delay: 0.15s; }
    .typing-dot:nth-child(3) { animation-delay: 0.3s; }

    @keyframes typingBounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-6px); opacity: 1; }
    }

    /* ─── QUICK ACTIONS ─── */
    .quick-actions {
      padding: 0 20px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      flex-shrink: 0;
      padding-bottom: 12px;
    }

    .quick-btn {
      padding: 8px 14px;
      border-radius: 100px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-secondary);
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
      white-space: nowrap;
    }

    .quick-btn:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-active);
      color: var(--text-primary);
      transform: translateY(-1px);
    }

    .quick-btn.citizen-quick:hover {
      border-color: rgba(34, 211, 238, 0.3);
      box-shadow: 0 0 12px var(--accent-citizen-glow);
      color: var(--accent-citizen);
    }

    .quick-btn.gov-quick:hover {
      border-color: rgba(245, 158, 11, 0.3);
      box-shadow: 0 0 12px var(--accent-gov-glow);
      color: var(--accent-gov);
    }

    /* ─── INPUT AREA ─── */
    .input-area {
      padding: 16px 20px;
      border-top: 1px solid var(--border);
      backdrop-filter: blur(20px);
      background: rgba(10, 10, 15, 0.85);
      flex-shrink: 0;
    }

    .input-wrapper {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 6px;
      transition: var(--transition);
    }

    .input-wrapper:focus-within {
      border-color: var(--border-active);
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.03);
    }

    .input-wrapper:focus-within.citizen-input {
      border-color: rgba(34, 211, 238, 0.3);
      box-shadow: 0 0 0 3px var(--accent-citizen-dim);
    }

    .input-wrapper:focus-within.gov-input {
      border-color: rgba(245, 158, 11, 0.3);
      box-shadow: 0 0 0 3px var(--accent-gov-dim);
    }

    #chatInput {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 14px;
      padding: 10px 12px;
      resize: none;
      line-height: 1.5;
      max-height: 120px;
      outline: none;
    }

    #chatInput::placeholder { color: var(--text-muted); }

    .input-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px;
    }

    .action-btn {
      width: 36px;
      height: 36px;
      border-radius: var(--radius-xs);
      border: none;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .action-btn:hover {
      background: var(--bg-card-hover);
      color: var(--text-secondary);
    }

    .send-btn {
      width: 36px;
      height: 36px;
      border-radius: var(--radius-xs);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      transition: var(--transition);
      color: #fff;
    }

    .send-btn.citizen-send {
      background: var(--accent-citizen);
      box-shadow: 0 0 16px var(--accent-citizen-glow);
    }

    .send-btn.gov-send {
      background: var(--accent-gov);
      box-shadow: 0 0 16px var(--accent-gov-glow);
    }

    .send-btn:hover { transform: scale(1.05); }
    .send-btn:active { transform: scale(0.95); }

    .send-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }

    /* ─── IMAGE PREVIEW ─── */
    .image-preview-bar {
      display: none;
      padding: 8px 20px;
      flex-shrink: 0;
    }

    .image-preview-bar.visible { display: flex; }

    .img-preview-item {
      position: relative;
      width: 64px;
      height: 64px;
      border-radius: var(--radius-xs);
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .img-preview-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .img-remove-btn {
      position: absolute;
      top: 2px;
      right: 2px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.7);
      border: none;
      color: #fff;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ─── WELCOME SCREEN ─── */
    .welcome {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      text-align: center;
      gap: 20px;
    }

    .welcome-icon {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      transition: var(--transition);
    }

    .welcome-icon.citizen-icon {
      background: var(--accent-citizen-dim);
      box-shadow: 0 0 40px var(--accent-citizen-glow);
    }

    .welcome-icon.gov-icon {
      background: var(--accent-gov-dim);
      box-shadow: 0 0 40px var(--accent-gov-glow);
    }

    .welcome h2 {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .welcome p {
      color: var(--text-secondary);
      font-size: 14px;
      max-width: 400px;
      line-height: 1.6;
    }

    .welcome-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      max-width: 440px;
      width: 100%;
      margin-top: 8px;
    }

    .welcome-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 16px;
      text-align: left;
      cursor: pointer;
      transition: var(--transition);
    }

    .welcome-card:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-active);
      transform: translateY(-2px);
    }

    .welcome-card .card-icon {
      font-size: 20px;
      margin-bottom: 8px;
    }

    .welcome-card .card-title {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .welcome-card .card-desc {
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.4;
    }

    /* ─── FOOTER ─── */
    .footer-note {
      text-align: center;
      font-size: 11px;
      color: var(--text-muted);
      padding: 8px;
      font-family: var(--font-mono);
    }

    /* ─── BACKGROUND EFFECTS ─── */
    .bg-gradient {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      pointer-events: none;
      z-index: -1;
    }

    .bg-gradient::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(ellipse at 30% 20%, rgba(34, 211, 238, 0.04) 0%, transparent 50%),
                  radial-gradient(ellipse at 70% 80%, rgba(245, 158, 11, 0.03) 0%, transparent 50%);
      animation: bgShift 20s ease-in-out infinite alternate;
    }

    @keyframes bgShift {
      0% { transform: translate(0, 0); }
      100% { transform: translate(-5%, -3%); }
    }

    /* ─── HIDDEN FILE INPUT ─── */
    #imageUpload { display: none; }

    /* ─── RESPONSIVE ─── */
    @media (max-width: 600px) {
      .header { padding: 12px 16px; }
      .messages { padding: 16px; }
      .quick-actions { padding: 0 16px; padding-bottom: 10px; }
      .input-area { padding: 12px 16px; }
      .welcome-grid { grid-template-columns: 1fr; }
      .mode-btn { padding: 6px 12px; font-size: 10px; }
      .welcome h2 { font-size: 20px; }
    }

    /* ─── MARKDOWN-LIKE TABLE ─── */
    .msg-content table {
      width: 100%;
      border-collapse: collapse;
      margin: 10px 0;
      font-size: 13px;
    }

    .msg-content th, .msg-content td {
      padding: 8px 12px;
      border: 1px solid var(--border);
      text-align: left;
    }

    .msg-content th {
      background: rgba(255, 255, 255, 0.05);
      font-weight: 600;
      text-transform: uppercase;
      font-size: 11px;
      letter-spacing: 0.3px;
    }

    /* ─── SEVERITY BADGES ─── */
    .badge-l1 { color: var(--success); }
    .badge-l2 { color: var(--accent-gov); }
    .badge-l3 { color: var(--danger); }
  </style>
</head>
<body>
  <div class="bg-gradient"></div>
  <div class="app" id="app">
    <!-- HEADER -->
    <header class="header">
      <div class="header-left">
        <div class="logo-mark citizen" id="logoMark">NN</div>
        <div>
          <div class="header-title">NagarNetra AI</div>
          <div class="header-subtitle" id="headerSubtitle">Citizen Guide</div>
        </div>
      </div>
      <div class="mode-toggle">
        <button class="mode-btn active citizen-mode" id="citizenBtn" onclick="switchMode('citizen')">🏠 Citizen</button>
        <button class="mode-btn gov-mode" id="govBtn" onclick="switchMode('gov')">🏛️ Government</button>
      </div>
    </header>

    <!-- WELCOME SCREEN (shown initially) -->
    <div class="welcome" id="welcomeScreen">
      <div class="welcome-icon citizen-icon" id="welcomeIcon">🛣️</div>
      <h2 id="welcomeTitle">How can I help you today?</h2>
      <p id="welcomeDesc">I'm your NagarNetra AI assistant. Ask me anything about reporting potholes, filing RTI complaints, or understanding severity levels.</p>
      <div class="welcome-grid" id="welcomeGrid">
        <!-- Populated by JS based on mode -->
      </div>
    </div>

    <!-- MESSAGES (hidden initially) -->
    <div class="messages" id="messagesArea" style="display: none;"></div>

    <!-- IMAGE PREVIEW -->
    <div class="image-preview-bar" id="imagePreviewBar">
      <div class="img-preview-item" id="imgPreviewItem">
        <img id="imgPreviewSrc" src="" alt="Upload preview" />
        <button class="img-remove-btn" onclick="removeImage()">✕</button>
      </div>
    </div>

    <!-- QUICK ACTIONS -->
    <div class="quick-actions" id="quickActions"></div>

    <!-- INPUT -->
    <div class="input-area">
      <div class="input-wrapper citizen-input" id="inputWrapper">
        <textarea id="chatInput" rows="1" placeholder="Ask about potholes, RTI, severity..." onkeydown="handleKeyDown(event)" oninput="autoResize(this)"></textarea>
        <div class="input-actions">
          <button class="action-btn" onclick="triggerImageUpload()" title="Upload pothole image">📷</button>
          <button class="send-btn citizen-send" id="sendBtn" onclick="sendMessage()">➤</button>
        </div>
      </div>
      <input type="file" id="imageUpload" accept="image/*" onchange="handleImageUpload(event)" />
    </div>

    <div class="footer-note">NagarNetra AI · Powered by Gemini · Not legal advice</div>
  </div>

  <script>
    // ─── STATE ───
    let currentMode = 'citizen';
    let messages = [];
    let isLoading = false;
    let uploadedImageBase64 = null;
    let uploadedImageName = null;
    let conversationHistory = [];

    // ─── WELCOME CARDS ───
    const welcomeCards = {
      citizen: [
        { icon: '📸', title: 'Report a Pothole', desc: 'Learn how to capture and submit a report', prompt: 'How do I report a pothole using NagarNetra?' },
        { icon: '📋', title: 'File RTI Complaint', desc: 'Generate a formal RTI complaint text', prompt: 'Generate an RTI complaint for a severe pothole on my street' },
        { icon: '⚠️', title: 'Severity Levels', desc: 'Understand L1, L2, L3 classification', prompt: 'Explain pothole severity levels L1, L2, L3 and what each means' },
        { icon: '🔍', title: 'Verify a Photo', desc: 'Check if a pothole image is genuine', prompt: 'How does pothole photo verification work?' },
      ],
      gov: [
        { icon: '🚨', title: 'Priority Ranking', desc: 'Which potholes to fix first', prompt: 'How should we prioritize pothole repairs? Give me a priority matrix.' },
        { icon: '💰', title: 'Repair Cost Estimate', desc: 'Budget estimation per severity', prompt: 'Give me estimated repair costs for L1, L2, and L3 potholes based on CPWD/IRC rates' },
        { icon: '✅', title: 'Verify Repair Claims', desc: 'Detect fake before/after photos', prompt: 'How can we verify if a contractor repair claim is genuine or fake?' },
        { icon: '📊', title: 'Dashboard Analytics', desc: 'Understanding audit data', prompt: 'What metrics should a municipal pothole dashboard track?' },
      ]
    };

    // ─── QUICK ACTIONS ───
    const quickActions = {
      citizen: [
        { label: '📋 Generate RTI', prompt: 'Generate a complete RTI complaint text I can submit to municipal authorities about a dangerous pothole' },
        { label: '💰 Repair Cost', prompt: 'What is the estimated repair cost for different pothole severity levels?' },
        { label: '📸 Photo Tips', prompt: 'What makes a good pothole photo for AI detection? Give me tips.' },
        { label: '⚖️ My Rights', prompt: 'What are my rights as a citizen regarding road maintenance and pothole complaints in India?' },
      ],
      gov: [
        { label: '🚨 Priority Matrix', prompt: 'Create a priority matrix for pothole repair based on severity, traffic density, and age of complaint' },
        { label: '💰 Budget Plan', prompt: 'Create a budget estimation table for repairing 50 potholes across L1, L2, and L3 severity levels' },
        { label: '🔍 Verify Photo', prompt: 'What techniques does NagarNetra use to verify pothole photos are genuine and not manipulated?' },
        { label: '📈 KPI Metrics', prompt: 'What KPIs should we track for pothole repair accountability?' },
      ]
    };

    // ─── INIT ───
    function init() {
      renderWelcome();
      renderQuickActions();
    }

    // ─── MODE SWITCH ───
    function switchMode(mode) {
      currentMode = mode;
      const citizenBtn = document.getElementById('citizenBtn');
      const govBtn = document.getElementById('govBtn');
      const logoMark = document.getElementById('logoMark');
      const headerSubtitle = document.getElementById('headerSubtitle');
      const inputWrapper = document.getElementById('inputWrapper');
      const sendBtn = document.getElementById('sendBtn');

      citizenBtn.classList.toggle('active', mode === 'citizen');
      govBtn.classList.toggle('active', mode === 'gov');

      logoMark.className = `logo-mark ${mode === 'citizen' ? 'citizen' : 'gov'}`;
      headerSubtitle.textContent = mode === 'citizen' ? 'Citizen Guide' : 'Government Advisor';
      inputWrapper.className = `input-wrapper ${mode === 'citizen' ? 'citizen-input' : 'gov-input'}`;
      sendBtn.className = `send-btn ${mode === 'citizen' ? 'citizen-send' : 'gov-send'}`;

      // Reset conversation
      messages = [];
      conversationHistory = [];
      document.getElementById('messagesArea').innerHTML = '';
      document.getElementById('messagesArea').style.display = 'none';
      document.getElementById('welcomeScreen').style.display = 'flex';

      renderWelcome();
      renderQuickActions();
    }

    // ─── RENDER WELCOME ───
    function renderWelcome() {
      const grid = document.getElementById('welcomeGrid');
      const icon = document.getElementById('welcomeIcon');
      const title = document.getElementById('welcomeTitle');
      const desc = document.getElementById('welcomeDesc');

      icon.className = `welcome-icon ${currentMode === 'citizen' ? 'citizen-icon' : 'gov-icon'}`;
      icon.textContent = currentMode === 'citizen' ? '🛣️' : '🏛️';
      title.textContent = currentMode === 'citizen' ? 'How can I help you today?' : 'Municipal Command Center';
      desc.textContent = currentMode === 'citizen'
        ? 'I\'m your NagarNetra AI assistant. Ask me anything about reporting potholes, filing RTI complaints, or understanding severity levels.'
        : 'AI-powered advisory for pothole prioritization, repair cost estimation, contractor verification, and audit analytics.';

      const cards = welcomeCards[currentMode];
      grid.innerHTML = cards.map(c => `
        <div class="welcome-card" onclick="handleWelcomeCard('${c.prompt.replace(/'/g, "\\'")}')">
          <div class="card-icon">${c.icon}</div>
          <div class="card-title">${c.title}</div>
          <div class="card-desc">${c.desc}</div>
        </div>
      `).join('');
    }

    // ─── RENDER QUICK ACTIONS ───
    function renderQuickActions() {
      const container = document.getElementById('quickActions');
      const actions = quickActions[currentMode];
      const cls = currentMode === 'citizen' ? 'citizen-quick' : 'gov-quick';
      container.innerHTML = actions.map(a => `
        <button class="quick-btn ${cls}" onclick="handleQuickAction('${a.prompt.replace(/'/g, "\\'")}')">${a.label}</button>
      `).join('');
    }

    // ─── HANDLE WELCOME CARD CLICK ───
    function handleWelcomeCard(prompt) {
      document.getElementById('chatInput').value = prompt;
      sendMessage();
    }

    // ─── HANDLE QUICK ACTION ───
    function handleQuickAction(prompt) {
      document.getElementById('chatInput').value = prompt;
      sendMessage();
    }

    // ─── SEND MESSAGE ───
    async function sendMessage() {
      const input = document.getElementById('chatInput');
      const sendBtn = document.getElementById('sendBtn');
      const text = input.value.trim();
      if (!text && !uploadedImageBase64) return;
      if (isLoading) return;

      // Hide welcome, show messages
      document.getElementById('welcomeScreen').style.display = 'none';
      document.getElementById('messagesArea').style.display = 'flex';

      // Snapshot history BEFORE adding current message (backend builds its own list)
      const historySnapshot = conversationHistory.slice(-10);

      // Add user message to UI & local history
      addMessageToUI('user', text);
      conversationHistory.push({ role: 'user', content: text });

      // Clear input
      input.value = '';
      input.style.height = 'auto';
      const imgData = uploadedImageBase64;
      const imgName = uploadedImageName;
      removeImage();

      // Disable send button, show typing
      isLoading = true;
      sendBtn.disabled = true;
      const typingEl = addTypingIndicator();

      try {
        const payload = {
          message: text,
          mode: currentMode,
          history: historySnapshot,  // history WITHOUT current message
        };

        if (imgData) {
          payload.image_base64 = imgData;
          payload.image_name = imgName;
        }

        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });

        if (!response.ok) {
          throw new Error(`Server error: ${response.status}`);
        }

        const data = await response.json();

        // Remove typing
        typingEl.remove();

        if (data.success) {
          addMessageToUI('ai', data.response);
          // Store as 'model' role for Gemini compatibility
          conversationHistory.push({ role: 'model', content: data.response });
        } else {
          addMessageToUI('ai', `⚠️ ${data.response || 'Something went wrong. Please try again.'}`);
        }
      } catch (err) {
        typingEl.remove();
        addMessageToUI('ai', `⚠️ Connection error: ${err.message}. Make sure you open this page from <strong>http://localhost:8000/chat</strong>`);
        console.error(err);
      } finally {
        isLoading = false;
        sendBtn.disabled = false;
      }
    }

    // ─── ADD MESSAGE TO UI ───
    function addMessageToUI(role, content) {
      const area = document.getElementById('messagesArea');
      const modeClass = currentMode === 'citizen' ? 'citizen-msg' : 'gov-msg';
      const avatarClass = currentMode === 'gov' && role === 'user' ? 'gov-avatar' : '';
      const avatar = role === 'ai' ? '🤖' : (currentMode === 'citizen' ? '👤' : '🏛️');
      const sender = role === 'ai' ? 'NagarNetra AI' : (currentMode === 'citizen' ? 'You' : 'Official');

      // Convert markdown-like formatting to HTML
      const formattedContent = formatResponse(content);

      const div = document.createElement('div');
      div.className = `message ${role} ${role === 'user' ? modeClass : ''}`;
      div.innerHTML = `
        <div class="msg-avatar ${avatarClass}">${avatar}</div>
        <div class="msg-body">
          <div class="msg-sender">${sender}</div>
          <div class="msg-content">${formattedContent}</div>
        </div>
      `;

      area.appendChild(div);
      area.scrollTop = area.scrollHeight;
    }

    // ─── FORMAT RESPONSE (basic markdown) ───
    function formatResponse(text) {
      if (!text) return '';

      let html = text
        // Code blocks
        .replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>')
        // Inline code
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        // Bold
        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
        // Italic
        .replace(/\*([^*]+)\*/g, '<em>$1</em>')
        // Headers
        .replace(/^### (.+)$/gm, '<h4>$1</h4>')
        .replace(/^## (.+)$/gm, '<h3>$1</h3>')
        // Unordered lists
        .replace(/^\* (.+)$/gm, '<li>$1</li>')
        .replace(/^- (.+)$/gm, '<li>$1</li>')
        // Ordered lists
        .replace(/^\d+\. (.+)$/gm, '<li>$1</li>')
        // Line breaks
        .replace(/\n\n/g, '</p><p>')
        .replace(/\n/g, '<br/>');

      // Wrap loose <li> in <ul>
      html = html.replace(/((?:<li>.*?<\/li>\s*)+)/g, '<ul>$1</ul>');

      // Wrap in paragraphs if not already
      if (!html.startsWith('<')) html = '<p>' + html + '</p>';

      return html;
    }

    // ─── TYPING INDICATOR ───
    function addTypingIndicator() {
      const area = document.getElementById('messagesArea');
      const div = document.createElement('div');
      div.className = 'message ai';
      div.id = 'typingMsg';
      div.innerHTML = `
        <div class="msg-avatar">🤖</div>
        <div class="msg-body">
          <div class="msg-sender">NagarNetra AI</div>
          <div class="msg-content">
            <div class="typing-indicator">
              <div class="typing-dot"></div>
              <div class="typing-dot"></div>
              <div class="typing-dot"></div>
            </div>
          </div>
        </div>
      `;
      area.appendChild(div);
      area.scrollTop = area.scrollHeight;
      return div;
    }

    // ─── IMAGE UPLOAD ───
    function triggerImageUpload() {
      document.getElementById('imageUpload').click();
    }

    function handleImageUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (e) => {
        uploadedImageBase64 = e.target.result.split(',')[1]; // strip data:image/...;base64,
        uploadedImageName = file.name;

        document.getElementById('imgPreviewSrc').src = e.target.result;
        document.getElementById('imagePreviewBar').classList.add('visible');
      };
      reader.readAsDataURL(file);
    }

    function removeImage() {
      uploadedImageBase64 = null;
      uploadedImageName = null;
      document.getElementById('imagePreviewBar').classList.remove('visible');
      document.getElementById('imageUpload').value = '';
    }

    // ─── INPUT HELPERS ───
    function handleKeyDown(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    function autoResize(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 120) + 'px';
    }

    // ─── BOOT ───
    init();
  </script>
</body>
</html>
